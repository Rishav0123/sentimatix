name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r mcp/requirements.txt

    - name: Run tests
      run: |
        pytest -q || true

    - name: Build Docker image (optional)
      if: ${{ always() }}
      run: |
        docker build -t sentimatix-backend -f backend/Dockerfile .

    - name: Push to GitHub Container Registry (optional)
      if: ${{ secrets.CR_PAT != '' }}
      env:
        CR_PAT: ${{ secrets.CR_PAT }}
      run: |
        echo $CR_PAT | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        docker tag sentimatix-backend ghcr.io/${{ github.repository_owner }}/sentimatix-backend:latest
        docker push ghcr.io/${{ github.repository_owner }}/sentimatix-backend:latest
