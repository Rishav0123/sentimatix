[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentimatix-mcp"
version = "1.0.1"
description = "Model Context Protocol server for Sentimatix - Indian Stock Market Sentiment Intelligence"
readme = "README.md"
authors = [
    { name = "Rishav Dutta", email = "rishavduttakgp@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "starlette>=0.27.0",
    "mcp>=1.0.0",
    "supabase>=2.27.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.3",
    "openai>=1.3.5",
    "anthropic>=0.7.0",
    "tiktoken>=0.5.1",
    "numpy>=1.26.0,<2.0",
    "requests==2.31.0",
    "python-dateutil==2.8.2",
    "pytz==2023.3",
    "structlog==23.2.0"
]

[project.scripts]
sentimatix-mcp = "mcp_stdio:main"

[tool.setuptools]
py-modules = ["mcp_stdio"]
packages = ["server", "server.tools", "server.utils"]

# REQUIRED BY ANTHROPIC OFFICIAL REGISTRY
[tool.mcp]
mcpName = "sentimatix"
